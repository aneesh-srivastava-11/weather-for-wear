<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather for Wear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-night-clear text-white antialiased min-h-screen flex items-center justify-center p-4 transition-colors duration-700">

    <!-- Main Container -->
    <main class="w-full max-w-md space-y-6">
        
        <!-- Header -->
        <header class="flex justify-between items-start pb-2">
            <div class="relative group z-50">
                <div id="location-display" class="text-3xl font-bold flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity drop-shadow-md" title="Click to change">
                    <span>Loading...</span>
                    <i class="ph ph-caret-down text-lg opacity-70"></i>
                </div>
                <div class="text-[10px] font-mono opacity-60 uppercase tracking-widest mt-1 flex flex-wrap items-center gap-2">
                    Via <span id="geo-source">...</span>
                    <span class="opacity-40">•</span>
                    <span id="local-time-display" class="normal-case">...</span>
                    <span id="offline-badge" class="hidden text-[9px] bg-red-500/20 text-red-300 px-1.5 py-0.5 rounded border border-red-500/30 flex items-center gap-1 normal-case font-bold"><i class="ph ph-wifi-slash"></i> Offline</span>
                </div>

                <!-- Search Form -->
                <form id="search-form" class="hidden absolute top-12 left-0 w-72 search-dropdown border border-white/10 p-2 rounded-xl shadow-2xl flex flex-col gap-2">
                    <div class="flex gap-2">
                        <input id="search-input" type="text" placeholder="Search city..." class="bg-white/10 text-white px-3 py-2 text-sm flex-1 rounded-lg outline-none font-mono placeholder-white/30 focus:bg-white/20 transition-colors" autocomplete="off">
                        <button type="button" id="search-cancel" class="text-white/50 hover:text-white px-2"><i class="ph ph-x"></i></button>
                    </div>
                    <div id="use-gps-btn" class="p-2 hover:bg-white/10 rounded-lg cursor-pointer text-xs text-blue-300 flex items-center gap-2 transition-colors font-mono">
                        <i class="ph ph-crosshair"></i> Use Current Location
                    </div>
                    <ul id="suggestions-list" class="hidden max-h-48 overflow-y-auto border-t border-white/10 pt-2 space-y-1"></ul>
                </form>
            </div>

            <!-- Toggles -->
            <div class="flex gap-2">
                <button id="activity-toggle" class="glass-panel px-3 py-1.5 rounded-full text-xs font-medium hover:bg-white/20 transition-all flex items-center gap-1.5 backdrop-blur-md">
                    <i class="ph ph-person-simple-walk text-lg"></i>
                </button>
                <button id="unit-toggle" class="glass-panel px-3 py-1.5 rounded-full text-xs font-mono font-bold hover:bg-white/20 transition-all backdrop-blur-md">
                    °C
                </button>
                <button id="refresh-btn" class="glass-panel p-1.5 rounded-full hover:bg-white/20 transition-all backdrop-blur-md">
                    <i class="ph ph-arrows-clockwise text-lg"></i>
                </button>
            </div>
        </header>

        <!-- SKELETON LOADER (Visible when loading) -->
        <div id="loader-skeleton" class="space-y-6 hidden">
            <div class="space-y-3">
                <div class="skeleton h-12 w-3/4 rounded-lg"></div>
                <div class="skeleton h-6 w-1/2 rounded-lg"></div>
            </div>
            <div class="grid grid-cols-4 gap-2">
                <div class="skeleton h-20 rounded-xl"></div>
                <div class="skeleton h-20 rounded-xl"></div>
                <div class="skeleton h-20 rounded-xl"></div>
                <div class="skeleton h-20 rounded-xl"></div>
            </div>
        </div>

        <!-- LIVE CONTENT -->
        <div id="content-area" class="space-y-6 opacity-100 transition-opacity duration-500">
            
            <!-- USP 1: Verdict -->
            <section class="space-y-2">
                <div id="clothing-recommendation" class="text-5xl font-bold leading-[1.1] drop-shadow-lg tracking-tight">
                    <!-- "Heavy Coat" -->
                </div>
                <div id="accessories-recommendation" class="text-lg font-medium opacity-90 drop-shadow-md flex items-center gap-2">
                    <!-- "Don't forget gloves" -->
                </div>
            </section>

            <!-- Weather Tips -->
            <section id="tips-container" class="hidden glass-panel p-3.5 rounded-2xl border-l-4 border-amber-400/80 flex items-start gap-3 transition-all duration-300">
                <div class="text-amber-300 text-lg mt-0.5 animate-pulse">
                    <i class="ph ph-lightbulb"></i>
                </div>
                <div class="flex-1 space-y-1">
                    <h3 class="text-[10px] font-mono uppercase tracking-widest opacity-60">Advice & Tips</h3>
                    <ul id="tips-list" class="text-xs font-medium opacity-90 space-y-1 list-none pl-0">
                        <!-- Dynamic tips injected here -->
                    </ul>
                </div>
            </section>

            <!-- Stats Grid (Glass) -->
            <section class="grid grid-cols-4 gap-3">
                <div class="glass-panel p-3 rounded-2xl flex flex-col items-center justify-center text-center">
                    <i class="ph ph-thermometer text-xl opacity-70 mb-1"></i>
                    <div id="temp-display" class="font-bold text-lg leading-none">--</div>
                    <div class="text-[10px] opacity-60 uppercase mt-1">Temp</div>
                </div>
                <div class="glass-panel p-3 rounded-2xl flex flex-col items-center justify-center text-center">
                    <i class="ph ph-hand-palm text-xl opacity-70 mb-1"></i>
                    <div id="feels-like-display" class="font-bold text-lg leading-none">--</div>
                    <div class="text-[10px] opacity-60 uppercase mt-1">Feels</div>
                </div>
                <div class="glass-panel p-3 rounded-2xl flex flex-col items-center justify-center text-center">
                    <i class="ph ph-wind text-xl opacity-70 mb-1"></i>
                    <div id="wind-display" class="font-bold text-lg leading-none">--</div>
                    <div class="text-[10px] opacity-60 uppercase mt-1">Wind</div>
                </div>
                <div class="glass-panel p-3 rounded-2xl flex flex-col items-center justify-center text-center">
                    <i class="ph ph-drop text-xl opacity-70 mb-1"></i>
                    <div id="rain-display" class="font-bold text-lg leading-none">--</div>
                    <div class="text-[10px] opacity-60 uppercase mt-1">Rain</div>
                </div>
            </section>

            <!-- USP 2: Timeline (Glass) -->
            <section class="glass-panel p-4 rounded-3xl">
                <h2 class="text-xs font-mono uppercase tracking-widest opacity-60 mb-3 ml-1">24h Forecast</h2>
                <div id="timeline-display" class="flex gap-3 overflow-x-auto pb-2 snap-x snap-mandatory hide-scrollbar">
                    <!-- Cards injected here -->
                </div>
            </section>

            <!-- Footer Status -->
            <footer class="text-center pt-4 opacity-40 text-[10px] font-mono">
                <span id="status-msg">Ready</span>
            </footer>
        </div>

    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
